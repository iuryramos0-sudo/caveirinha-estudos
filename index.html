<script>
/* =========================================================
   RANKING — desempenho de todos, com % acerto e contagem
   por DIA, SEMANA, MÊS e GERAL (da nuvem)
========================================================= */
function setPeriodoRanking(p){
  state.periodRanking=p;
  document.querySelectorAll('#pillsPeriodo button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  renderRankingAll();
}
function registrosDoPeriodo(period){
  const now=new Date();
  return state.records.filter(r=>{
    if(!r.date) return false;
    const d=new Date(r.date+'T12:00:00');
    if(isNaN(d)) return false;
    if(period==='total') return true;
    if(period==='dia') return d.toDateString()===now.toDateString();
    const diff=(now-d)/86400000;
    if(period==='semana') return diff>=0&&diff<7;
    if(period==='mes') return diff>=0&&diff<30;
    return true;
  });
}
function renderRankingTable(){
  const period=state.periodRanking;
  const titulos={dia:'Questões · hoje',semana:'Questões · últimos 7 dias',mes:'Questões · últimos 30 dias',total:'Questões · geral'};
  $('rankingPeriodoTitulo').textContent=titulos[period]||'Questões';
  const map={};
  registrosDoPeriodo(period).forEach(r=>{
    const op=r.operador||OPERADOR||'Você';
    if(!map[op]) map[op]={q:0,c:0};
    map[op].q+=r.total; map[op].c+=r.correct;
  });
  const rows=Object.entries(map).map(([nome,v])=>({nome,...v,pct:v.q?Math.round(v.c/v.q*100):0}))
    .sort((a,b)=>b.q-a.q||b.pct-a.pct);
  if(!rows.length){ $('rankingBody').innerHTML='<tr><td colspan="6"><div class="empty">Nenhum registro neste período ainda.</div></td></tr>'; return; }
  const maxQ=Math.max(1,...rows.map(x=>x.q));
  const medals=['🥇','🥈','🥉'];
  $('rankingBody').innerHTML=rows.map((x,i)=>`<tr class="${x.nome===OPERADOR?'me-row':''}" style="${x.nome===OPERADOR?'background:rgba(139,92,246,.08)':''}">
    <td style="width:44px"><span class="medal">${medals[i]||((i+1)+'º')}</span></td>
    <td><b>${esc(x.nome)}</b>${x.nome===OPERADOR?' <span class="tag" style="margin-left:6px">você</span>':''}</td>
    <td class="num"><b>${x.q}</b></td>
    <td class="num">${x.c}</td>
    <td class="num"><b style="color:${x.pct>=70?'var(--ok)':x.pct>=50?'var(--warn)':'var(--bad)'}">${x.pct}%</b></td>
    <td style="width:180px"><div class="progress"><i style="width:${Math.round(x.q/maxQ*100)}%"></i></div></td>
  </tr>`).join('');
}

let rankingGlobal=[];
async function carregarRankingNuvem(){
  const {data,error}=await supabaseClient.from('ranking').select('nome, questoes_resolvidas, cronograma_concluido');
  if(error) return;
  if(data) rankingGlobal=data;
}
async function sincronizarProgressoRanking(){
  if(!OPERADOR||!OPERADOR_HASH) return;
  const meQ=state.records.reduce((a,r)=>a+(Number(r.total)||0),0);
  const meDone=CRON_ATIVO?(CRON_ATIVO.done||[]).filter(Boolean).length:0;
  await supabaseClient.rpc('atualizar_progresso',{p_nome:OPERADOR,p_pin_hash:OPERADOR_HASH,p_questoes:meQ,p_cronograma:meDone});
  await carregarRankingNuvem();
}
function renderCronRanking(){
  const dias=(CRON_ATIVO&&CRON_ATIVO.dias.length)||30;
  const lista=rankingGlobal.length?[...rankingGlobal].sort((a,b)=>(b.cronograma_concluido||0)-(a.cronograma_concluido||0)):[];
  if(!lista.length){ $('rankingProgress').innerHTML='<div class="empty">Sincronizando ranking do cronograma...</div>'; return; }
  const medals=['🥇','🥈','🥉'];
  $('rankingProgress').innerHTML=lista.map((x,i)=>{
    const done=x.cronograma_concluido||0;
    const pct=Math.min(100,Math.round(done/dias*100));
    const me=x.nome===OPERADOR;
    return `<div class="missionrow ${me?'me':''}"><span class="daynum">${medals[i]||((i+1)+'º')}</span>
      <div class="rowfill"><strong>${esc(x.nome)}${me?' · VOCÊ':''}</strong><div class="progress" style="margin-top:7px"><i style="width:${pct}%"></i></div></div>
      <b>${done} dias · ${pct}%</b></div>`;
  }).join('');
}
function renderRankingSummary(){
  const boxes=[['dia','HOJE'],['semana','7 DIAS'],['mes','30 DIAS'],['total','GERAL']].map(([p,lab])=>{
    const regs=registrosDoPeriodo(p).filter(r=>(r.operador||OPERADOR)===(OPERADOR||'Você'));
    const q=regs.reduce((a,r)=>a+r.total,0), c=regs.reduce((a,r)=>a+r.correct,0);
    const pct=q?Math.round(c/q*100):0;
    return `<div class="stat"><label>${lab}</label><strong>${q}</strong><small>${c} certas · ${pct}% de acerto</small></div>`;
  }).join('');
  $('rankingSummary').innerHTML=`<div class="stats" style="grid-template-columns:1fr 1fr;margin-bottom:0">${boxes}</div>
  <p class="notice info" style="margin-top:14px">A tabela acima mostra o desempenho de <b>todos os operadores</b> com quantidade e % de acerto. Sincronizado direto do Supabase.</p>`;
}
function renderRankingAll(){ renderRankingTable(); renderCronRanking(); renderRankingSummary(); }

/* =========================================================
   NAVEGAÇÃO
========================================================= */
let currentPage='dashboard';
const PAGE_NAMES={dashboard:'Central de comando',registro:'Registrar estudo',questoes:'Questões registradas',desempenho:'Desempenho',edital:'Editais',cronogramas:'Cronogramas',ranking:'Rankings',foco:'Modo foco',conta:'Minha conta'};
function openPage(page){
  currentPage=page;
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  const el=$(page); if(el) el.classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  $('pageTitle').textContent=PAGE_NAMES[page]||page;
  renderCurrent();
  scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>openPage(b.dataset.page));
function renderCurrent(){
  renderStats(); renderTodayMission();
  if(currentPage==='dashboard') renderDashboardCharts();
  if(currentPage==='questoes') renderHistory();
  if(currentPage==='desempenho') renderPerformancePage();
  if(currentPage==='edital') renderEdital();
  if(currentPage==='cronogramas') renderCronogramas();
  if(currentPage==='ranking') renderRankingAll();
  if(currentPage==='conta') renderConta();
}
function renderConta(){ $('contaNomeAtual').textContent=OPERADOR||'—'; }
function renderAll(){renderCurrent()}

/* =========================================================
   DASHBOARD
========================================================= */
function renderStats(){
  const total=state.records.reduce((a,r)=>a+r.total,0), correct=state.records.reduce((a,r)=>a+r.correct,0),
    minutes=state.records.reduce((a,r)=>a+r.minutes,0), pct=total?Math.round(correct/total*100):0;
  const done=CRON_ATIVO?(CRON_ATIVO.done||[]).filter(Boolean).length:0;
  const len=CRON_ATIVO?CRON_ATIVO.dias.length:30;
  let next=CRON_ATIVO?(CRON_ATIVO.done||[]).findIndex(d=>!d):-1;
  $('sProgress').textContent=len?Math.round(done/len*100)+'%':'0%';
  $('sNext').textContent=next<0?(len+' dias concluídos'):'Próximo alvo: Dia '+(next+1);
  $('sQuestions').textContent=total;
  $('sCorrect').textContent=correct+' certas';
  $('sAccuracy').textContent=pct+'%';
  $('sMinutes').textContent=minutes<60?minutes+'m':Math.floor(minutes/60)+'h '+minutes%60+'m';
  const dates=new Set(state.records.map(r=>r.date));
  let streak=0; const check=new Date();
  while(dates.has(check.toISOString().slice(0,10))){streak++;check.setDate(check.getDate()-1)}
  $('sStreak').textContent=streak+' dias';
}
function renderTodayMission(){
  if(!CRON_ATIVO){ $('todayStudyTitle').textContent='Nenhum cronograma ativo'; $('todayStudyText').textContent='Ative um cronograma na aba Cronogramas.'; return; }
  const today=new Date(); const key=String(today.getDate()).padStart(2,'0')+'/'+String(today.getMonth()+1).padStart(2,'0');
  const index=CRON_ATIVO.dias.findIndex(c=>c[2]===key);
  if(index>=0){ const c=CRON_ATIVO.dias[index];
    $('todayStudyTitle').textContent='DIA '+String(index+1).padStart(2,'0')+' · '+c[0];
    $('todayStudyText').textContent=c[1];
  } else { $('todayStudyTitle').textContent='Missão do dia fora do ciclo atual'; $('todayStudyText').textContent='Consulte o cronograma para continuar pela próxima missão pendente.'; }
  const exam=new Date('2026-10-11T00:00:00'); const start=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const diff=Math.ceil((exam-start)/86400000);
  $('examCountdown').textContent=diff>0?'⚔ FALTAM '+diff+' DIAS PARA A PROVA DA PMMA · 11/10/2026':(diff===0?'⚔ HOJE É DIA DE PROVA · PMMA':'⚔ DATA DA PROVA JÁ PASSOU');
}
function baseChart(extra){
  return Object.assign({
    chart:{background:'transparent',fontFamily:'Inter, sans-serif',foreColor:'#8b93a7',toolbar:{show:false},animations:{enabled:true,easing:'easeinout',speed:600}},
    grid:{borderColor:'rgba(229,45,71,.12)',strokeDashArray:4},
    tooltip:{theme:'dark'},
    dataLabels:{enabled:false}
  },extra||{});
}
function destroyChart(key){ if(charts[key]){try{charts[key].destroy()}catch(e){} delete charts[key];} }

function renderDashboardCharts(){
  renderStockChart(); renderDonutChart(); renderDailyBars(); renderErrorChart(); renderPriorityList(); renderWeaknessList();
}

/* 1. LINHA (estilo mercado financeiro) — precisão acumulada */
function renderStockChart(){
  destroyChart('stock');
  const ordered=[...state.records].filter(r=>r.total>0).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.id-b.id);
  if(!ordered.length){ $('stockChart').innerHTML='<div class="empty">Aguardando registros para desenhar a tendência.</div>'; return; }
  let cumT=0,cumC=0;
  const pts=ordered.map(r=>{cumT+=r.total;cumC+=r.correct;return {x:(r.date||'').split('-').reverse().slice(0,2).join('/'),y:+(cumC/cumT*100).toFixed(2)}});
  charts.stock=new ApexCharts($('stockChart'),{
    chart:Object.assign(baseChart().chart,{type:'area',height:260,sparkline:{enabled:false}}),
    series:[{name:'Precisão acumulada',data:pts}],
    colors:['#ff5267'],
    stroke:{curve:'smooth',width:2.5},
    fill:{type:'gradient',gradient:{shadeIntensity:1,opacityFrom:.45,opacityTo:.05,stops:[0,95]}},
    markers:{size:0,hover:{size:5}},
    yaxis:{min:0,max:100,tickAmount:4,labels:{formatter:v=>v.toFixed(0)+'%'}},
    xaxis:{categories:pts.map(p=>p.x),labels:{show:true,rotate:0,hideOverlappingLabels:true},axisBorder:{show:false},axisTicks:{show:false}},
    tooltip:{theme:'dark',y:{formatter:val=>val+'% de acerto'}}
  });
  charts.stock.render();
}

/* 2. DONUT — composição por disciplina */
function renderDonutChart(){
  destroyChart('donut');
  const grouped={};
  state.records.forEach(r=>{const s=r.subject||'Sem disciplina';grouped[s]=(grouped[s]||0)+(r.total||0)});
  const entries=Object.entries(grouped).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){ $('donutChart').innerHTML='<div class="empty">Registre questões para ver a composição.</div>'; return; }
  const palette=['#e52d47','#ff5267','#ff7080','#c2410c','#fb7185','#ff8b97','#ff6b6b','#ff5267','#ff5267','#c2410c'];
  charts.donut=new ApexCharts($('donutChart'),{
    chart:Object.assign(baseChart().chart,{type:'donut',height:260}),
    series:entries.map(e=>e[1]),
    labels:entries.map(e=>e[0]),
    colors:palette,
    legend:{position:'bottom',fontSize:'12px',markers:{radius:12}},
    plotOptions:{pie:{donut:{size:'68%',labels:{show:true,name:{fontSize:'11px',color:'#8b93a7'},value:{fontSize:'22px',fontFamily:'Space Grotesk',color:'#fef2f2'},total:{show:true,label:'questões',color:'#8b93a7'}}}}},
    tooltip:{theme:'dark',y:{formatter:v=>v+' questões'}}
  });
  charts.donut.render();
}

/* 3. BARRAS — questões por dia (14 dias) */
function renderDailyBars(){
  destroyChart('bars');
  const days=[];
  for(let i=13;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    const q=state.records.filter(r=>r.date===key).reduce((a,r)=>a+r.total,0);
    days.push({key,q,label:d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})});
  }
  const max=Math.max(1,...days.map(x=>x.q));
  charts.bars=new ApexCharts($('chart'),{
    chart:Object.assign(baseChart().chart,{type:'bar',height:240}),
    series:[{name:'Questões',data:days.map(x=>x.q)}],
    colors:['#e52d47'],
    plotOptions:{bar:{borderRadius:6,columnWidth:'55%',distributed:false}},
    xaxis:{categories:days.map(x=>x.label),axisBorder:{show:false},axisTicks:{show:false}},
    yaxis:{labels:{formatter:v=>Math.round(v)}},
    tooltip:{theme:'dark',y:{formatter:(v,opt)=>v+' questões · '+days[opt.dataPointIndex].key}},
    states:{hover:{filter:{type:'darken'}}}
  });
  charts.bars.render();
}

/* 4. BARRAS HORIZONTAIS — motivos de erro */
function renderErrorChart(){
  destroyChart('err');
  const motivos={};
  state.records.forEach(r=>{
    let m=r.reason||'none';
    if(r.total>r.correct){
      if(!m||m==='none') m='Não informado';
      motivos[m]=(motivos[m]||0)+((r.total-r.correct));
    }
  });
  const entries=Object.entries(motivos).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){ $('errorChart').innerHTML='<div class="empty">Nenhum erro registrado — ou nenhum motivo informado. Continue assim! 💪</div>'; return; }
  charts.err=new ApexCharts($('errorChart'),{
    chart:Object.assign(baseChart().chart,{type:'bar',height:240}),
    series:[{name:'Erros',data:entries.map(e=>e[1])}],
    colors:['#fb7185'],
    plotOptions:{bar:{horizontal:true,borderRadius:6}},
    xaxis:{categories:entries.map(e=>e[0])},
    tooltip:{theme:'dark',y:{formatter:v=>v+' erros'}}
  });
  charts.err.render();
}
function getTopicStats(){
  const m={};
  state.records.forEach(r=>{
    const ts=Array.isArray(r.topics)&&r.topics.length?r.topics:[r.topic||'Assunto não informado'];
    const share=1/ts.length;
    ts.forEach(t=>{
      if(!m[t]) m[t]={subject:r.subject,total:0,correct:0,last:r.date};
      m[t].total+=(r.total||0)*share; m[t].correct+=(r.correct||0)*share;
      if((r.date||'')>(m[t].last||'')) m[t].last=r.date;
    });
  });
  return Object.entries(m).map(([topic,v])=>({...v,topic,accuracy:v.total?Math.round(v.correct/v.total*100):0}));
}
function renderPriorityList(){
  const topics=getTopicStats().filter(x=>x.total>0);
  const scored=topics.map(x=>{
    const days=Math.max(0,(Date.now()-new Date(x.last+'T12:00:00'))/86400000);
    return {...x,score:(100-x.accuracy)+Math.min(30,days*2)+Math.max(0,20-Math.min(20,x.total/5))};
  }).sort((a,b)=>b.score-a.score).slice(0,3);
  $('priorityList').innerHTML=scored.length?scored.map((x,i)=>`<div class="pitem ${x.accuracy<60?'high':x.accuracy<75?'med':'good'}">
    <div class="pt"><b>${i+1}. ${esc(x.subject)} — ${esc(x.topic)}</b><strong>${x.accuracy}%</strong></div>
    <small>${Math.round(x.total)} questões · última atividade: ${new Date(x.last+'T12:00:00').toLocaleDateString('pt-BR')} · ${x.accuracy<60?'REVISAR URGENTEMENTE':x.accuracy<75?'PRECISA DE REFORÇO':'MANTER DOMÍNIO'}</small>
  </div>`).join(''):'<div class="empty">Registre questões para o sistema identificar suas prioridades.</div>';
}
function renderWeaknessList(){
  const disciplines={};
  state.records.forEach(r=>{
    const s=r.subject||'Sem disciplina';
    if(!disciplines[s]) disciplines[s]={total:0,correct:0,last:r.date};
    disciplines[s].total+=r.total||0; disciplines[s].correct+=r.correct||0;
    if((r.date||'')>(disciplines[s].last||'')) disciplines[s].last=r.date;
  });
  const weak=Object.entries(disciplines).map(([subject,v])=>({subject,...v,accuracy:v.total?Math.round(v.correct/v.total*100):0}))
    .filter(x=>x.total>0).sort((a,b)=>a.accuracy-b.accuracy).slice(0,5);
  $('disciplineWeakness').innerHTML=weak.length?weak.map((x,i)=>`<div class="pitem ${x.accuracy<60?'high':x.accuracy<75?'med':'good'}">
    <div class="pt"><b>${i+1}. ${esc(x.subject)}</b><strong>${x.accuracy}%</strong></div>
    <small>${x.correct} de ${x.total} certas · última atividade: ${x.last?new Date(x.last+'T12:00:00').toLocaleDateString('pt-BR'):'—'}</small>
  </div>`).join(''):'<div class="empty">Registre questões para ver o mapa de fraquezas.</div>';
}

/* =========================================================
   DESEMPENHO — 5 tipos diferentes de gráfico
========================================================= */
function renderPerformancePage(){ renderWaterfall(); renderCandles(); renderRadar(); renderStacked(); renderPlanProgress(); renderPerformanceCards(); }

/* 1. CASCATA (waterfall) — acertos por disciplina */
function renderWaterfall(){
  destroyChart('wf');
  const grouped={};
  state.records.forEach(r=>{const s=r.subject||'Sem disciplina';if(!grouped[s])grouped[s]={t:0,c:0};grouped[s].t+=r.total||0;grouped[s].c+=r.correct||0});
  const entries=Object.entries(grouped).filter(e=>e[1].t>0);
  if(!entries.length){ $('waterfallChart').innerHTML='<div class="empty">Registre questões para desenhar a cascata.</div>'; return; }
  const cats=[],base=[],up=[],down=[];
  let cum=0;
  entries.forEach(([s,v])=>{
    const correct=v.c, errors=v.t-v.c;
    cats.push(s.length>16?s.slice(0,15)+'…':s);
    base.push(cum);
    up.push(correct>0?correct:0);
    down.push(errors>0?-errors:0);
    cum+=correct-errors;
  });
  cats.push('ACUMULADO'); base.push(0); up.push(cum>0?cum:0); down.push(0);
  charts.wf=new ApexCharts($('waterfallChart'),{
    chart:Object.assign(baseChart().chart,{type:'bar',height:300,stacked:true}),
    series:[{name:'base',data:base},{name:'Acertos +',data:up},{name:'Erros −',data:down}],
    colors:['rgba(0,0,0,0)','#ff7080','#fb7185'],
    plotOptions:{bar:{columnWidth:'62%'}},
    legend:{show:false},
    xaxis:{categories:cats,axisBorder:{show:false},axisTicks:{show:false},labels:{trim:true}},
    yaxis:{labels:{formatter:v=>Math.round(v)}},
    tooltip:{theme:'dark',custom:function({seriesIndex,dataPointIndex,w}){
      if(seriesIndex===0) return '';
      const s=w.globals.seriesNames[seriesIndex];
      return `<div style="padding:6px 10px"><b>${cats[dataPointIndex]}</b><br>${s}: ${seriesIndex===1?up[dataPointIndex]:down[dataPointIndex]}</div>`;
    }}
  });
  charts.wf.render();
}

/* 2. CANDLESTICK — estilo mercado financeiro por dia */
function renderCandles(){
  destroyChart('candle');
  const byDay={};
  state.records.forEach(r=>{ if(!r.total)return; if(!byDay[r.date])byDay[r.date]={t:0,c:0}; byDay[r.date].t+=r.total; byDay[r.date].c+=r.correct; });
  const days=Object.keys(byDay).sort();
  if(days.length<1){ $('candleChart').innerHTML='<div class="empty">Sem dados suficientes para o candlestick.</div>'; return; }
  let cumT=0,cumC=0;
  const data=days.map(d=>{
    const day=byDay[d];
    const prev=cumT?+(cumC/cumT*100).toFixed(2):0;
    cumT+=day.t; cumC+=day.c;
    const close=+(cumC/cumT*100).toFixed(2);
    const dayAcc=+(day.c/day.t*100).toFixed(2);
    const open=days.length===1?Math.max(0,close-1):prev;
    return {x:d.split('-').reverse().join('/'),y:[open,Math.max(open,close,dayAcc),Math.min(open,close,dayAcc),close]};
  });
  charts.candle=new ApexCharts($('candleChart'),{
    chart:Object.assign(baseChart().chart,{type:'candlestick',height:300}),
    series:[{data}],
    plotOptions:{candlestick:{colors:{upward:'#ff7080',downward:'#fb7185'},wick:{useFillColor:true}}},
    xaxis:{type:'category',parseDates:false,axisBorder:{show:false},axisTicks:{show:false}},
    yaxis:{tooltip:{enabled:true},labels:{formatter:v=>v.toFixed(0)+'%'}},
    tooltip:{theme:'dark'}
  });
  charts.candle.render();
}

/* 3. RADAR — precisão por disciplina */
function renderRadar(){
  destroyChart('radar');
  const grouped={};
  state.records.forEach(r=>{const s=r.subject||'Sem disciplina';if(!grouped[s])grouped[s]={t:0,c:0};grouped[s].t+=r.total||0;grouped[s].c+=r.correct||0});
  const entries=Object.entries(grouped).filter(e=>e[1].t>0);
  if(!entries.length){ $('radarChart').innerHTML='<div class="empty">Registre questões para ativar o radar.</div>'; return; }
  charts.radar=new ApexCharts($('radarChart'),{
    chart:Object.assign(baseChart().chart,{type:'radar',height:300}),
    series:[{name:'Precisão',data:entries.map(e=>e[1].t?+(e[1].c/e[1].t*100).toFixed(1):0)}],
    labels:entries.map(e=>e[0]),
    colors:['#ff5267'],
    stroke:{width:2},
    fill:{opacity:.2},
    markers:{size:4},
    plotOptions:{radar:{polygons:{strokeColors:'rgba(229,45,71,.22)',connectorColors:'rgba(229,45,71,.22)'}},},
    yaxis:{min:0,max:100,labels:{show:false}},
    tooltip:{theme:'dark',y:{formatter:v=>v+'%'}}
  });
  charts.radar.render();
}

/* 4. BARRAS EMPILHADAS — acertos × erros por dia */
function renderStacked(){
  destroyChart('stack');
  const days=[];
  for(let i=13;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10);
    const regs=state.records.filter(r=>r.date===key);
    const c=regs.reduce((a,r)=>a+r.correct,0), e=regs.reduce((a,r)=>a+(r.total-r.correct),0);
    if(c+e>0) days.push({label:d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}),c,e});
  }
  if(!days.length){ $('stackedChart').innerHTML='<div class="empty">Sem questões nos últimos 14 dias.</div>'; return; }
  charts.stack=new ApexCharts($('stackedChart'),{
    chart:Object.assign(baseChart().chart,{type:'bar',height:280,stacked:true,stackType:'100%'}),
    series:[{name:'Certas',data:days.map(x=>x.c)},{name:'Erros',data:days.map(x=>x.e)}],
    colors:['#ff7080','#fb7185'],
    plotOptions:{bar:{borderRadius:5,columnWidth:'55%'}},
    legend:{position:'top',markers:{radius:12}},
    xaxis:{categories:days.map(x=>x.label),axisBorder:{show:false},axisTicks:{show:false}},
    yaxis:{labels:{formatter:v=>v.toFixed(0)+'%'}},
    tooltip:{theme:'dark',y:{formatter:v=>v.toFixed(0)+'%'}}
  });
  charts.stack.render();
}

/* 5. Progresso do plano + cartões por disciplina */
function renderPlanProgress(){
  if(!CRON_ATIVO){ $('performancePlanLabel').textContent='nenhum cronograma ativo'; $('dayProgress').innerHTML=''; $('performancePlanBar').style.width='0%'; return; }
  const done=(CRON_ATIVO.done||[]).filter(Boolean).length, len=CRON_ATIVO.dias.length;
  $('planProgressTitle').textContent='Missões do cronograma: '+CRON_ATIVO.nome;
  $('performancePlanLabel').textContent=done+'/'+len+' concluídos · '+(len-done)+' pendentes';
  $('performancePlanBar').style.width=Math.round(done/len*100)+'%';
  const next=(CRON_ATIVO.done||[]).findIndex(d=>!d);
  $('dayProgress').innerHTML=CRON_ATIVO.dias.map((_,i)=>`<div class="daytile ${(CRON_ATIVO.done||[])[i]?'done':''} ${i===next?'next':''}" title="Dia ${i+1}">${String(i+1).padStart(2,'0')}</div>`).join('');
}
function renderPerformanceCards(){
  const grouped={};
  state.records.forEach(r=>{
    const s=r.subject||'Sem disciplina';
    if(!grouped[s]) grouped[s]={total:0,correct:0,minutes:0,topics:{}};
    const g=grouped[s];
    g.total+=r.total||0; g.correct+=r.correct||0; g.minutes+=r.minutes||0;
    const topics=Array.isArray(r.topics)&&r.topics.length?r.topics:[r.topic||'Assunto não informado'];
    const share=1/topics.length;
    topics.forEach(t=>{ if(!g.topics[t]) g.topics[t]={total:0,correct:0}; g.topics[t].total+=(r.total||0)*share; g.topics[t].correct+=(r.correct||0)*share; });
  });
  const entries=Object.entries(grouped);
  if(!entries.length){ $('performanceBySubject').innerHTML='<div class="panel"><div class="empty">Nenhum registro ainda — seus indicadores por disciplina aparecerão aqui.</div></div>'; return; }
  $('performanceBySubject').innerHTML=entries.map(([s,g])=>{
    const acc=g.total?Math.round(g.correct/g.total*100):0;
    const rows=Object.entries(g.topics).map(([t,v])=>`<div class="topicline" style="display:grid;grid-template-columns:1fr 90px 90px 70px;gap:8px;font-size:12.5px"><span>${esc(t)}</span><span class="num">${Math.round(v.total)} questões</span><span class="num">${Math.round(v.correct)} certas</span><span class="num"><b>${v.total?Math.round(v.correct/v.total*100):0}%</b></span></div>`).join('');
    return `<details class="panel" open><summary style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:Space Grotesk;font-weight:600"><span>${esc(s)}</span><span class="tag ${acc>=70?'ok':acc>=50?'warn':'bad'}">${acc}% precisão · ${g.total} questões</span></summary>${rows}</details>`;
  }).join('');
}

/* =========================================================
   HISTÓRICO
========================================================= */
function renderHistory(){
  if(!state.records.length){ $('historyTable').innerHTML='<tr><td colspan="7"><div class="empty">Nenhum registro na nuvem ainda.</div></td></tr>'; return; }
  $('historyTable').innerHTML=state.records.map(r=>{
    const acc=r.total?Math.round(r.correct/r.total*100):0;
    return `<tr><td>${r.date?new Date(r.date+'T12:00:00').toLocaleDateString('pt-BR'):'—'}</td><td><b>${esc(r.subject)}</b></td><td style="max-width:340px"><small style="color:var(--muted)">${esc(r.topic||'—')}</small></td><td class="num">${r.total}</td><td class="num">${r.correct}</td><td class="num"><b style="color:${acc>=70?'var(--ok)':acc>=50?'var(--warn)':'var(--bad)'}">${acc}%</b></td><td style="text-align:right"><button class="iconbtn" title="Apagar registro" onclick="deleteRecord(${r.id})">🗑</button></td></tr>`;
  }).join('');
}

/* =========================================================
   MODO FOCO
========================================================= */
function updateTimer(){
  const m=String(Math.floor(focusSeconds/60)).padStart(2,'0'), s=String(focusSeconds%60).padStart(2,'0');
  $('timer').textContent=m+':'+s;
  if(focusSeconds===0){ clearInterval(focusTimer); focusTimer=null; toast('Ciclo concluído. Registre a vitória! ⚔','ok'); }
}
function toggleFocus(){
  if(focusTimer){ clearInterval(focusTimer); focusTimer=null; $('focusToggle').textContent='Retomar ciclo'; }
  else{ focusTimer=setInterval(()=>{ if(focusSeconds>0){focusSeconds--;updateTimer()} },1000); $('focusToggle').textContent='Pausar ciclo'; }
}
function resetFocus(){ clearInterval(focusTimer); focusTimer=null; focusSeconds=1500; updateTimer(); $('focusToggle').textContent='Iniciar ciclo'; }
async function saveFocus(){
  if(!OPERADOR) return toast('Entre na sua conta antes de salvar o ciclo.','warn');
  const {error}=await supabaseClient.from('registros').insert({operador:OPERADOR,data:new Date().toISOString().slice(0,10),tipo:'sessao',disciplina:'FOCO',assuntos:['Ciclo de foco 25 min'],total:0,certas:0,minutos:25,motivo_erro:'none'});
  if(error) return toast('Erro ao salvar ciclo: '+error.message,'bad');
  resetFocus(); await carregarRegistros(); renderCurrent(); sincronizarProgressoRanking();
  toast('Ciclo de foco salvo na nuvem ✅','ok');
}

/* =========================================================
   BOOT
========================================================= */
verificarOperador();

<script>
/* ============ CONTA: renomear / trocar PIN / apagar ============ */
async function renomearOperador(e){
  e.preventDefault();
  const nomeNovo=$('conta-nome-novo').value.trim();
  if(!nomeNovo) return toast('Digite o novo nome de guerra.','warn');
  const {data,error}=await supabaseClient.rpc('renomear_operador',{p_nome_atual:OPERADOR,p_pin_hash:OPERADOR_HASH,p_nome_novo:nomeNovo});
  if(error) return toast('Erro técnico: '+(error.message||JSON.stringify(error)),'bad');
  if(!data||!data.ok) return toast((data&&data.erro)?data.erro:'Não foi possível renomear.','bad');
  guardarSessao(data.nome,OPERADOR_HASH);
  setUserChip(); $('formRenomear').reset(); renderConta();
  toast('Nome atualizado com sucesso! ✅','ok');
  await carregarRankingNuvem();
}
async function trocarPinOperador(e){
  e.preventDefault();
  const pinAtual=$('conta-pin-atual').value.trim(), pinNovo=$('conta-pin-novo').value.trim(), pinConf=$('conta-pin-novo-confirma').value.trim();
  if(!/^\d{4}$/.test(pinAtual)||!/^\d{4}$/.test(pinNovo)) return toast('O PIN precisa ter exatamente 4 números.','warn');
  if(pinNovo!==pinConf) return toast('Os PINs novos não conferem.','warn');
  const hashAtual=await sha256Hex(pinAtual), hashNovo=await sha256Hex(pinNovo);
  const {data,error}=await supabaseClient.rpc('trocar_pin_operador',{p_nome:OPERADOR,p_pin_hash_atual:hashAtual,p_pin_hash_novo:hashNovo});
  if(error) return toast('Erro técnico: '+(error.message||JSON.stringify(error)),'bad');
  if(!data||!data.ok) return toast((data&&data.erro)?data.erro:'Não foi possível trocar o PIN.','bad');
  guardarSessao(OPERADOR,hashNovo);
  $('formTrocarPin').reset();
  toast('PIN atualizado com sucesso! ✅','ok');
}
async function apagarConta(){
  if(!confirm('Tem certeza que quer apagar o operador "'+OPERADOR+'" da nuvem? Isso apaga nome, PIN e posição no ranking. Não pode ser desfeito.'))return;
  const pin=prompt('Para confirmar, digite seu PIN de 4 dígitos:');
  if(!pin||!/^\d{4}$/.test(pin)) return toast('PIN inválido. Operação cancelada.','warn');
  const pinHash=await sha256Hex(pin);
  const {data,error}=await supabaseClient.rpc('apagar_operador',{p_nome:OPERADOR,p_pin_hash:pinHash});
  if(error) return toast('Erro técnico: '+(error.message||JSON.stringify(error)),'bad');
  if(!data||!data.ok) return toast((data&&data.erro)?data.erro:'Não foi possível apagar a conta.','bad');
  toast('Conta apagada da nuvem. Você será desconectado.','warn');
  setTimeout(sairOperador,1200);
}
async function novoEditalVazio(){
  if(!confirm('Criar um edital novo em branco? Ele substitui o conteúdo do edital ativo na nuvem (os registros já feitos continuam salvos).'))return;
  EDITAL={nome:'Meu edital',disciplinas:[]};
  await salvarEdital('Novo edital em branco criado ✅');
}
</script>
